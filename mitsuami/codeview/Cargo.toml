[workspace]

[package]
name = "sourcegit-codeview"
description = "SourceGit's code view: an embedded bemtvi, in one C ABI library with mitsuami's and extras'"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "sourcegit_codeview"
crate-type = ["cdylib", "rlib"]

[features]
kde = ["mitsuami-extras-ffi/kde", "mitsuami/kde"]
# The headless backend, for the port's C# tests (`src/test_host.rs`). Never in what ships.
test-host = ["dep:mitsuami-headless"]

# Tests run on mitsuami's own harness (native UI must own the main thread).
[[test]]
name = "ffi"
harness = false

# The sibling checkouts, as the port's csproj takes mitsuamia's: extras' and
# mitsuami's C ABIs aren't published, and neither is bemtvi.
[dependencies]
anyhow = "=1.0.104"
# A sibling `bemtvi` checkout, as `edge.yml` makes one. On the maintainer's Linux machine it's a
# link to the worktree with the branch in progress, as bemtvi's `main` is others' to work on.
bemtvi-mitsuami = { path = "../../../bemtvi/crates/bemtvi-mitsuami" }
mitsuami = { path = "../../../mitsuami/crates/mitsuami" }
mitsuami-ffi = { path = "../../../mitsuami/crates/mitsuami-ffi" }
mitsuami-extras-ffi = { path = "../../../mitsuami-extras/crates/mitsuami-extras-ffi" }
mitsuami-headless = { path = "../../../mitsuami/crates/mitsuami-headless", optional = true }
serde_json = "=1.0.154"

[dev-dependencies]
mitsuami-test = { path = "../../../mitsuami/crates/mitsuami-test" }

# bemtvi takes mitsuami from crates.io, extras its C ABI from a release's tag, and the port the
# sibling checkout. Two mitsuamis in one process would be two cores, so they build against the
# sibling too.
[patch.crates-io]
mitsuami = { path = "../../../mitsuami/crates/mitsuami" }
mitsuami-test = { path = "../../../mitsuami/crates/mitsuami-test" }

[patch."https://github.com/Roboport-Tecnologia/mitsuami"]
mitsuami-ffi = { path = "../../../mitsuami/crates/mitsuami-ffi" }

# bemtvi and its renderer are far too slow unoptimized to judge how the editor feels, so
# everything but this crate is optimized in the build the harness and `run-port.sh` use.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
debug = false

# As bemtvi's, for what's packaged: this workspace's profiles are the ones that count.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
